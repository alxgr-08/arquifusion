name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the checksum-verified secret scanner
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the complete Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner --log-opts="--all"'
      - name: Scan the checked-out files with redacted output
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner'

  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit development and worker requirements
        run: python -m pip_audit --strict --progress-spinner off -r requirements-dev.txt -r infra/bridge_airi/requirements.txt
      - name: Audit the exact dependencies packaged for Lambda
        run: |
          for lock in infra/aws/health_evaluator/requirements.lock infra/aws/incident/ai-requirements.lock services/stream_exporter/requirements-linux.lock services/lake_to_bigquery/requirements-linux.lock services/bigquery_sync_back/requirements-linux.lock; do
            python -m pip_audit --strict --progress-spinner off --no-deps --disable-pip -r "$lock"
          done

  frontend-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
