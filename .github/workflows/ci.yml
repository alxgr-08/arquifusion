name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check repository hygiene and local documentation links
        run: python scripts/check_repository.py
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate contracts
        run: python scripts/validate_contracts.py
      - name: Tests
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          PYTEST_ADDOPTS: "--disable-socket"
        run: python scripts/run_tests.py
      - name: Test infrastructure adapters offline
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m pytest -q --disable-socket infra/aws/test_plan_stage.py infra/aws/api infra/aws/health_evaluator infra/aws/incident infra/aws/telemetry infra/aws/maintenance infra/gcp infra/hosting infra/bridge_airi
      - name: Verify a single simulated reading at both destinations offline
        run: python infra/aws/telemetry/prepare_case.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_API_MODE: mock
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Validate public build settings
        run: python ../infra/hosting/prepare.py check-env
      - run: npm run build
      - name: Package the tested preview
        run: python ../infra/hosting/prepare.py amplify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-preview-${{ github.sha }}
          path: |
            infra/hosting/build/amplify-*/arquifusion-web.zip
            infra/hosting/build/amplify-*/amplify-rewrites.json
          if-no-files-found: error
          retention-days: 7
