name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate contracts
        run: python scripts/validate_contracts.py
      - name: Tests
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          PYTEST_ADDOPTS: "--disable-socket"
        run: python scripts/run_tests.py
      - name: Test infrastructure adapters offline
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m pytest -q --disable-socket infra/aws/api infra/aws/health_evaluator infra/aws/incident infra/aws/telemetry infra/aws/maintenance infra/gcp infra/hosting
      - name: Verify a single simulated reading at both destinations offline
        run: python infra/aws/telemetry/prepare_case.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
